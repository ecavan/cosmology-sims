name = "RvmProofs"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["RvmProofs"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false  # Mathlib style lints are for Mathlib PRs
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "RvmProofs"
